<html lang="en">

    <meta charset="UTF-8">

    <meta name="color-scheme" content="dark">
    <title>Jazz TV Channels — Secure Build</title>
    <style>
:root{--bg:#030712;--card:#0f172acc;--primary:#00e5ff;--accent:#ff356b;--border:#00e5ff38}
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 0,#00e5ff12,transparent 55%),#030712;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:100vw}
header{flex:none;background:#030712f2;border-bottom:1px solid var(--border);padding:12px 14px}
h1{font-size:1rem;color:var(--primary);margin:0 0 10px;letter-spacing:.08em}
.player-title{font-weight:700;font-size:.9rem;margin:0 0 7px}
.video-wrap{position:relative;background:#000;border:1px solid var(--border);border-radius:12px;overflow:hidden}
video{display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:contain}
.status{font: .75rem ui-monospace,monospace;color:#a8b5c8;min-height:1.4em;margin:7px 0}
.controls{display:flex;gap:8px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--border);padding:10px;background:#0f172a;color:#fff}
input{width:100%;min-width:0}
button{cursor:pointer}
button:focus-visible,input:focus-visible,.channel:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#retry{display:none;white-space:nowrap}
main{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.section-head{display:flex;justify-content:space-between;align-items:center;color:#a8b5c8;font-size:.8rem;letter-spacing:.08em;margin:2px 2px 12px}
#count{color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.channel{min-width:0;text-align:center;background:var(--card);border:1px solid #ffffff12;border-radius:12px;padding:10px 5px;cursor:pointer;color:#f1f5f9}
.channel:hover,.channel.active{border-color:var(--primary);box-shadow:0 0 14px #00e5ff20}
.logo{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#0b1120;border:1px solid var(--border);overflow:hidden;color:var(--primary);font-weight:800}
.logo img{width:100%;height:100%;object-fit:cover}
.name{font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{font-size:.62rem;color:var(--primary);text-transform:uppercase;margin-top:4px}
.note{font-size:.72rem;color:#7c8ba1;text-align:center;padding:20px 4px}
@media(min-width:800px){header{padding:14px 22px}.player-shell{max-width:680px;margin:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}}
</style>
  </head>

    <div id="app">
      <header>
        <h1>KHUBAIB TV · SECURE PLAYER</h1>
        <div class="player-shell">

          <div class="video-wrap">
            <video id="video" controls playsinline preload="none">
            </video>
          </div>
          <div class="status" id="status" role="status" aria-live="polite">Ready</div>
          <div class="controls">
            <input id="search" type="search" placeholder="Search channels…" aria-label="Search channels" autocomplete="off" spellcheck="false">
            <button id="retry" type="button">Retry</button>
          </div>
        </div>
      </header>
      <main>
        <div class="section-head">
          <span>AVAILABLE CHANNELS</span>
          <span id="count">
          </span>
        </div>
        <div class="grid" id="grid">
        </div>
        <p class="note">Use only streams you are authorized to access. Availability depends on the provider.</p>
      </main>
    </div>

const video = document.getElementById('video');
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('player-title');
const searchEl = document.getElementById('search');
const retryBtn = document.getElementById('retry');
let hls = null;
let currentChannel = null;

function safeUrl(value, allowedHosts) {
  try {
    const url = new URL(value);
    if (url.protocol !== 'https:' || !allowedHosts.has(url.hostname) || url.username || url.password) return null;
    return url.href;
  } catch (_) { return null; }
}
function setStatus(message) { statusEl.textContent = message; }
function stopPlayback() {
  if (hls) { hls.destroy(); hls = null; }
  video.pause();
  video.removeAttribute('src');
  video.load();
}
function makeLogo(channel) {
  const wrap = document.createElement('div');
  wrap.className = 'logo';
  const src = safeUrl(channel.logo, ALLOWED_LOGO_HOSTS);
  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => { img.remove(); wrap.textContent = channel.name.slice(0,1).toUpperCase(); };
    wrap.appendChild(img);
  } else {
    wrap.textContent = channel.name.slice(0,1).toUpperCase();
  }
  return wrap;
}
function renderChannels() {
  const query = searchEl.value.trim().toLocaleLowerCase();
  const filtered = channels.filter(ch => ch.name.toLocaleLowerCase().includes(query) || ch.cat.toLocaleLowerCase().includes(query));
  grid.replaceChildren();
  document.getElementById('count').textContent = `${filtered.length} channels`;
  if (!filtered.length) {
    const empty = document.createElement('p');
    empty.style.cssText = 'grid-column:1/-1;text-align:center;color:#94a3b8;padding:28px 0';
    empty.textContent = 'No matching channels found.';
    grid.appendChild(empty);
    return;
  }
  for (const ch of filtered) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'channel' + (currentChannel && currentChannel.name === ch.name ? ' active' : '');
    card.setAttribute('aria-label', `Play ${ch.name}`);
    card.appendChild(makeLogo(ch));
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = ch.name;
    const cat = document.createElement('div');
    cat.className = 'cat';
    cat.textContent = ch.cat;
    card.append(name, cat);
    card.addEventListener('click', () => playChannel(ch));
    grid.appendChild(card);
  }
}
function playChannel(ch) {
  const streamUrl = safeUrl(ch.link, ALLOWED_STREAM_HOSTS);
  if (!streamUrl) { setStatus('Blocked: stream URL failed security validation.'); return; }
  currentChannel = ch;
  titleEl.textContent = ch.name;
  retryBtn.style.display = 'inline-block';
  setStatus('Connecting to stream…');
  stopPlayback();
  renderChannels();

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 30,
      maxBufferLength: 30,
      maxMaxBufferLength: 60
    });
    hls.on(Hls.Events.ERROR, (_event, data) => {
      if (data.fatal) {
        setStatus('Stream error or server unavailable. Check connection and tap Retry.');
        retryBtn.style.display = 'inline-block';
        hls.destroy();
        hls = null;
      }
    });
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setStatus(`Stream loaded · ${ch.name}`);
      video.play().catch(() => setStatus('Tap Play on the video to start playback.'));
    });
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
    video.addEventListener('loadedmetadata', () => {
      setStatus(`Stream loaded · ${ch.name}`);
      video.play().catch(() => setStatus('Tap Play on the video to start playback.'));
    }, {once:true});
    video.addEventListener('error', () => setStatus('Playback failed. The stream may be offline or unavailable.'), {once:true});
  } else {
    setStatus('This browser does not support HLS playback.');
  }
}
searchEl.addEventListener('input', renderChannels);
retryBtn.addEventListener('click', () => { if (currentChannel) playChannel(currentChannel); });
video.addEventListener('waiting', () => setStatus('Buffering…'));
video.addEventListener('playing', () => setStatus(`Playing · ${currentChannel ? currentChannel.name : 'Live stream'}`));
video.addEventListener('error', () => {
  if (currentChannel) setStatus('Video playback error. The stream may be offline or blocked by the provider.');
});
renderChannels();
</script>
