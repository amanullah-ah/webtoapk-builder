<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Audiowide:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nova+Square&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    :root{
      --bg:#050A06;
      --primary:#22c55e;
      --primary-bright:#4ade80;
      --primary-dark:#15803d;
      --primary-glow:rgba(34,197,94,0.5);
      --ink:#F8FAFC;
      --ink-soft:#94A3B8;
      --ink-faint:#5C6B85;
      --danger:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--bg);
      color:var(--ink);
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
      opacity:0;
      transition:opacity 1.2s ease;
    }
    body.loaded{opacity:1;}
    ::selection{background:rgba(34,197,94,0.35);}
    ::-webkit-scrollbar{width:8px;}
    ::-webkit-scrollbar-track{background:rgba(5,10,6,0.5);}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary),var(--primary-dark));border-radius:4px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--primary-bright);}

    @keyframes titleFlow{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
    @keyframes livePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(1.4);}}
    @keyframes ringPulse{0%{transform:scale(1);opacity:0.5;}100%{transform:scale(1.35);opacity:0;}}
    @keyframes haloSpin{to{transform:rotate(360deg);}}
    @keyframes shine{0%{background-position:200% 0;}60%,100%{background-position:-100% 0;}}
    @keyframes sweep{0%{left:-100%;}100%{left:100%;}}
    @keyframes iconPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(1.15);}}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
    @keyframes progressGlow{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
    @keyframes cursorBlink{0%,100%{opacity:1;}50%{opacity:0;}}
    @keyframes consoleFadeIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
    @keyframes pageFadeIn{0%{opacity:0;transform:translateY(18px) scale(0.985);filter:blur(6px);}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}
    @keyframes glowFadeIn{to{opacity:1;}}
    @keyframes floatGlow{0%{transform:translate(-55%,-52%) scale(1);}25%{transform:translate(-40%,-58%) scale(1.15);}50%{transform:translate(-45%,-40%) scale(0.92);}75%{transform:translate(-58%,-45%) scale(1.1);}100%{transform:translate(-55%,-52%) scale(1);}}
    @keyframes floatGlow2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,40px) scale(1.2);}}
    @keyframes borderFlow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
    @keyframes floatPhoto{0%,100%{transform:translateY(0) rotateX(0deg) rotateY(0deg);}25%{transform:translateY(-5px) rotateX(3deg) rotateY(-3deg);}50%{transform:translateY(0) rotateX(0deg) rotateY(0deg);}75%{transform:translateY(-5px) rotateX(-3deg) rotateY(3deg);}}
    @keyframes cornerPulse{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
    @keyframes orbitSpin{to{transform:rotate(360deg);}}
    @keyframes botFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
    @keyframes botBlink{0%,45%,55%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
    @keyframes antennaBlink{0%,100%{opacity:0.5;transform:translateX(-50%) scale(0.9);}50%{opacity:1;transform:translateX(-50%) scale(1.2);}}
    @keyframes lineFadeIn{to{opacity:1;transform:translateY(0);}}
    @keyframes crownWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}
    @keyframes robotBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
    @keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(0.9);}to{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes socialRise{from{opacity:0;transform:translateY(16px) scale(0.88);}to{opacity:1;transform:translateY(0) scale(1);}}
    @keyframes socialFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
    @keyframes loaderSlide{0%{left:-40%;}100%{left:100%;}}

    body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(100px);z-index:0;pointer-events:none;opacity:0;animation:glowFadeIn 1.6s ease-out 0.15s forwards;}
    body::before{width:460px;height:460px;background:rgba(34,197,94,0.22);top:-180px;left:-140px;}
    body::after{width:420px;height:420px;background:rgba(21,128,61,0.28);bottom:-160px;right:-140px;}
    .glow-mid{position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(110px);background:rgba(74,222,128,0.10);top:45%;left:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;animation:floatGlow 14s ease-in-out infinite;}
    .glow-top-right{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(100px);background:rgba(74,222,128,0.10);top:20%;right:-100px;z-index:0;pointer-events:none;animation:floatGlow2 18s ease-in-out infinite;}
    .grain-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.3;background-image:radial-gradient(rgba(34,197,94,0.05) 1px,transparent 1px);background-size:3px 3px;}

    /* Page loader */
    .page-loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity 0.8s ease,visibility 0.8s ease;}
    .page-loader.hidden-loader{opacity:0;visibility:hidden;pointer-events:none;}
    .loader-logo{font-size:48px;font-weight:900;white-space:nowrap;filter:drop-shadow(0 0 28px rgba(34,197,94,0.55));}
    .loader-bar{width:180px;height:4px;background:rgba(34,197,94,0.15);border-radius:999px;overflow:hidden;position:relative;}
    .loader-bar::before{content:"";position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--primary-bright),transparent);border-radius:999px;animation:loaderSlide 1.4s ease-in-out infinite;box-shadow:0 0 15px var(--primary-bright);}
    .loader-text{font-size:0.75rem;color:var(--ink-soft);text-transform:uppercase;font-weight:900;letter-spacing:2px;}

    /* Toast */
    .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
    .toast{padding:14px 22px;border-radius:14px;font-size:0.85rem;font-weight:700;letter-spacing:0.5px;color:#fff;box-shadow:0 12px 40px -8px rgba(0,0,0,0.7);animation:toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:auto;max-width:90vw;}
    .toast.success{background:linear-gradient(135deg,#22c55e,#15803d);border:1px solid #4ade80;}
    .toast.error{background:linear-gradient(135deg,#ef4444,#991b1b);border:1px solid #f87171;}
    .toast.info{background:linear-gradient(135deg,#3b82f6,#1e40af);border:1px solid #60a5fa;}

    /* Page layout */
    .page{max-width:520px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:16px 0 40px;animation:pageFadeIn 0.9s cubic-bezier(0.22,1,0.36,1) both;}
    .main-wrap{margin:0 12px;background:linear-gradient(180deg,rgba(10,20,16,0.88),rgba(5,10,6,0.96));border:1px solid rgba(34,197,94,0.18);border-radius:28px;padding:20px 16px 22px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(34,197,94,0.06) inset,0 30px 70px -30px rgba(34,197,94,0.4),0 2px 20px rgba(0,0,0,0.6);}
    .main-wrap::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,197,94,0.7),transparent);}
    .main-wrap::after{content:"";position:absolute;top:-100px;left:-100px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.08),transparent 70%);pointer-events:none;}

    /* Status bar */
    .statusbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(5,10,6,0.7);border:1px solid rgba(34,197,94,0.2);border-radius:14px;margin-bottom:14px;font-family:'Poppins',sans-serif;font-size:0.7rem;font-weight:800;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;position:relative;z-index:2;}
    .statusbar .sb-left{display:flex;align-items:center;gap:8px;}
    .statusbar .sb-dot{width:7px;height:7px;border-radius:50%;background:var(--primary-bright);box-shadow:0 0 8px 2px rgba(34,197,94,0.9);animation:livePulse 1.5s ease-in-out infinite;}
    .statusbar .sb-right{display:flex;gap:14px;color:var(--primary-bright);}

    /* Hero */
    .hero{display:flex;align-items:center;gap:18px;padding:10px 4px 24px;position:relative;z-index:2;}
    .hero-left{display:flex;align-items:center;gap:18px;min-width:0;flex:1;}
    .profile-wrap{position:relative;width:120px;height:120px;border-radius:28px;padding:3px;background:linear-gradient(135deg,#22c55e,#4ade80,#15803d,#22c55e);background-size:300% 300%;animation:borderFlow 5s linear infinite,floatPhoto 5s ease-in-out infinite;box-shadow:0 0 40px -4px rgba(34,197,94,0.9),0 0 0 1px rgba(34,197,94,0.5),0 14px 46px -10px rgba(34,197,94,0.65);flex-shrink:0;}
    .profile-wrap::before{content:"";position:absolute;inset:-12px;border-radius:36px;background:conic-gradient(from 0deg,rgba(34,197,94,0.95),transparent 30%,rgba(74,222,128,0.95),transparent 60%,rgba(34,197,94,0.95));filter:blur(18px);z-index:-1;animation:haloSpin 5s linear infinite;opacity:1;}
    .profile-wrap::after{content:"";position:absolute;inset:3px;border-radius:25px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.55) 50%,transparent 70%);background-size:250% 100%;animation:shine 3.5s ease-in-out infinite;pointer-events:none;z-index:2;}
    .profile-wrap img{width:100%;height:100%;border-radius:25px;object-fit:cover;display:block;border:2px solid rgba(5,10,6,0.95);transition:transform 0.6s cubic-bezier(0.22,1,0.36,1),filter 0.4s ease;position:relative;z-index:1;}
    .profile-wrap:hover img{transform:scale(1.08);filter:brightness(1.1) saturate(1.15);}
    .profile-corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--primary-bright);z-index:4;pointer-events:none;filter:drop-shadow(0 0 8px rgba(34,197,94,1));animation:cornerPulse 2s ease-in-out infinite;}
    .profile-corner.tl{top:-4px;left:-4px;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
    .profile-corner.tr{top:-4px;right:-4px;border-left:0;border-bottom:0;border-radius:0 10px 0 0;animation-delay:0.5s;}
    .profile-corner.bl{bottom:-4px;left:-4px;border-right:0;border-top:0;border-radius:0 0 0 10px;animation-delay:1s;}
    .profile-corner.br{bottom:-4px;right:-4px;border-left:0;border-top:0;border-radius:0 0 10px 0;animation-delay:1.5s;}
    .profile-orbit{position:absolute;inset:-16px;border-radius:40px;animation:orbitSpin 9s linear infinite;pointer-events:none;z-index:3;}
    .profile-orbit::before{content:"";position:absolute;top:-5px;left:50%;width:11px;height:11px;border-radius:50%;background:var(--primary-bright);box-shadow:0 0 16px 4px rgba(34,197,94,1);transform:translateX(-50%);}
    .profile-orbit::after{content:"";position:absolute;bottom:-5px;left:50%;width:9px;height:9px;border-radius:50%;background:#86efac;box-shadow:0 0 14px 3px rgba(34,197,94,0.95);transform:translateX(-50%);}
    .profile-ring{position:absolute;inset:-10px;border-radius:34px;border:2px solid var(--primary-bright);opacity:0.35;pointer-events:none;z-index:2;animation:ringPulse 2.8s ease-out infinite;}
    .brand-text{display:flex;flex-direction:column;align-items:flex-end;text-align:right;min-width:0;flex:1;}
    .app-title{font-family:'Audiowide',sans-serif;font-size:40px;font-weight:900;margin:0;line-height:1;letter-spacing:2px;white-space:nowrap;filter:drop-shadow(0 0 18px rgba(34,197,94,0.4));}
    .t-aman,.t-md{background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:titleFlow 5s ease-in-out infinite;}
    .t-aman{background-image:linear-gradient(135deg,#ffffff 20%,#4ade80 60%,#22c55e 100%);}
    .t-md{background-image:linear-gradient(135deg,#FFB347 20%,#FF8C00 60%,#F97316 100%);}
    .app-sub{font-family:'Poppins',sans-serif;font-size:0.72rem;font-weight:900;color:var(--primary-bright);letter-spacing:1px;margin-top:8px;text-transform:uppercase;opacity:0.95;text-shadow:0 0 12px rgba(34,197,94,0.6);display:flex;align-items:center;gap:8px;justify-content:flex-end;}
    .app-sub::before{content:"";display:inline-block;width:18px;height:1.5px;background:linear-gradient(90deg,transparent,var(--primary-bright));border-radius:2px;}
    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(34,197,94,0.35),transparent);margin:0 -16px 20px;}

    /* Section title */
    .section-title{display:flex;align-items:center;gap:10px;font-size:0.75rem;font-weight:800;letter-spacing:3px;color:var(--primary-bright);text-transform:uppercase;margin:22px 4px 12px;position:relative;}
    .section-title i{font-size:14px;filter:drop-shadow(0 0 8px rgba(34,197,94,0.8));}
    .section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(34,197,94,0.3),transparent);}

    /* Inputs */
    .input-wrap{position:relative;margin-bottom:14px;}
    .input-wrap .input-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--primary-bright);font-size:16px;filter:drop-shadow(0 0 8px rgba(34,197,94,0.7));pointer-events:none;z-index:2;}
    .input-wrap input{width:100%;background:rgba(5,10,6,0.85);border:1.5px solid rgba(34,197,94,0.4);border-radius:18px;padding:18px 18px 18px 48px;font-size:15px;font-weight:600;color:var(--ink);transition:all 0.25s ease;outline:none;box-shadow:0 0 0 1px rgba(34,197,94,0.05) inset,0 0 20px -8px rgba(34,197,94,0.6);}
    .input-wrap input::placeholder{color:var(--ink-faint);font-weight:500;}
    .input-wrap input:focus{border-color:rgba(34,197,94,0.9);box-shadow:0 0 0 1px rgba(34,197,94,0.15) inset,0 0 30px -6px rgba(34,197,94,0.9);}

    /* Buttons */
    .btn-generate{width:100%;padding:18px 20px;border:none;border-radius:18px;background:linear-gradient(135deg,#22c55e,#4ade80);color:#052e16;font-size:0.95rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;box-shadow:0 8px 30px -6px rgba(34,197,94,0.75),0 0 0 1px rgba(74,222,128,0.4) inset;transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.25s ease;margin-top:4px;}
    .btn-generate::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);transition:left 0.6s ease;}
    .btn-generate:hover::before{left:100%;}
    .btn-generate:hover{transform:translateY(-2px);box-shadow:0 14px 40px -6px rgba(34,197,94,1),0 0 0 1px rgba(74,222,128,0.6) inset;}
    .btn-generate:active{transform:scale(0.97);}
    .btn-generate:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
    .btn-generate i{font-size:16px;}

    /* Waiting box */
    .waiting-box{display:flex;align-items:center;gap:10px;padding:16px 18px;border-radius:18px;background:rgba(5,10,6,0.6);border:1px solid rgba(34,197,94,0.15);color:var(--ink-soft);font-size:0.85rem;font-weight:500;margin-top:14px;transition:all 0.3s ease;position:relative;overflow:hidden;}
    .waiting-box i{color:var(--ink-faint);font-size:16px;}
    .waiting-box.active{border-color:rgba(34,197,94,0.55);color:var(--primary-bright);box-shadow:0 0 24px -8px rgba(34,197,94,0.7);}
    .waiting-box.active i{color:var(--primary-bright);filter:drop-shadow(0 0 8px rgba(34,197,94,0.8));animation:iconPulse 1.5s ease-in-out infinite;}
    .waiting-box.active::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(34,197,94,0.15),transparent);animation:sweep 2s ease-in-out infinite;}

    /* Progress */
    .progress-container{width:100%;background:rgba(5,10,6,0.85);border-radius:999px;margin-top:14px;display:none;overflow:hidden;padding:3px;border:1px solid rgba(34,197,94,0.25);}
    .progress-bar{width:0%;height:10px;background:linear-gradient(90deg,#22c55e,#4ade80,#22c55e);background-size:200% 100%;border-radius:999px;transition:width 0.5s ease;animation:progressGlow 1.5s ease infinite;box-shadow:0 0 18px rgba(34,197,94,0.9);}

    /* Result card */
    .result-card{background:linear-gradient(180deg,rgba(15,26,18,0.95),rgba(10,20,16,0.98));border:1.5px solid rgba(34,197,94,0.4);border-radius:24px;padding:20px;margin-top:20px;box-shadow:0 20px 50px -20px rgba(34,197,94,0.6),0 0 0 1px rgba(34,197,94,0.1) inset;animation:pageFadeIn 0.6s ease;}
    .result-card video{width:100%;border-radius:16px;margin-bottom:18px;border:1px solid rgba(34,197,94,0.3);box-shadow:0 10px 30px -10px rgba(34,197,94,0.5);}
    .author-box{display:flex;align-items:center;gap:12px;background:rgba(5,10,6,0.6);border:1px solid rgba(34,197,94,0.2);border-radius:16px;padding:12px 16px;margin-bottom:16px;}
    .author-box img{width:48px;height:48px;border-radius:50%;border:2px solid var(--primary-bright);object-fit:cover;box-shadow:0 0 15px rgba(34,197,94,0.6);}
    .author-box h4{font-size:0.85rem;font-weight:800;color:#FFFFFF;margin:0;}
    .author-box p{font-size:0.65rem;font-weight:700;color:var(--primary-bright);letter-spacing:1px;text-transform:uppercase;margin:2px 0 0;}
    .result-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .res-btn{padding:15px 10px;border-radius:14px;font-size:0.72rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s ease;}
    .res-btn.primary{background:linear-gradient(135deg,#22c55e,#4ade80);color:#052e16;box-shadow:0 8px 25px -6px rgba(34,197,94,0.8);}
    .res-btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 35px -6px rgba(34,197,94,1);}
    .res-btn.secondary{background:rgba(5,10,6,0.7);border:1.5px solid rgba(34,197,94,0.4);color:var(--primary-bright);}
    .res-btn.secondary:hover{background:rgba(34,197,94,0.12);border-color:var(--primary-bright);}

    /* WhatsApp button */
    .whatsapp-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 20px;border-radius:18px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;text-decoration:none;font-size:0.75rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-top:16px;box-shadow:0 8px 30px -6px rgba(37,211,102,0.8);transition:all 0.25s ease;position:relative;overflow:hidden;}
    .whatsapp-btn::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transition:left 0.6s ease;}
    .whatsapp-btn:hover::before{left:100%;}
    .whatsapp-btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px -6px rgba(37,211,102,1);}
    .whatsapp-btn i{font-size:18px;}

    /* Loader ring */
    .loader-ring{width:44px;height:44px;border:3px solid rgba(34,197,94,0.15);border-top-color:var(--primary-bright);border-radius:50%;animation:haloSpin 1s linear infinite;margin:0 auto 14px;filter:drop-shadow(0 0 10px rgba(34,197,94,0.8));}

    /* Footer */
    footer.foot-note{text-align:center;font-size:11.5px;color:var(--ink-faint);padding:6px 24px 28px;margin-top:24px;position:relative;z-index:1;}

    .hidden{display:none !important;}

    /* Reveal */
    .reveal{opacity:0;transform:translateY(40px);transition:opacity 0.8s cubic-bezier(0.22,1,0.36,1),transform 0.8s cubic-bezier(0.22,1,0.36,1);}
    .reveal.revealed{opacity:1;transform:translateY(0);}
    .reveal-scale{opacity:0;transform:scale(0.85);transition:opacity 0.8s cubic-bezier(0.22,1,0.36,1),transform 0.8s cubic-bezier(0.22,1,0.36,1);}
    .reveal-scale.revealed{opacity:1;transform:scale(1);}
    .delay-1{transition-delay:0.1s;}.delay-2{transition-delay:0.2s;}.delay-3{transition-delay:0.3s;}
    .delay-4{transition-delay:0.4s;}.delay-5{transition-delay:0.5s;}.delay-6{transition-delay:0.6s;}

    @media (max-width:480px){
      .page{padding:12px 0 24px;}
      .main-wrap{margin:0 10px;padding:18px 14px 20px;border-radius:24px;}
      .profile-wrap{width:96px;height:96px;border-radius:22px;}
      .profile-wrap img{border-radius:19px;}
      .profile-wrap::after{border-radius:19px;inset:3px;}
      .profile-wrap::before{inset:-10px;border-radius:30px;}
      .profile-corner{width:16px;height:16px;border-width:2.5px;}
      .app-title{font-size:30px;letter-spacing:-1px;}
      .app-sub{font-size:0.62rem;letter-spacing:0.5px;}
      .hero{gap:14px;}.hero-left{gap:14px;}
      .statusbar{font-size:0.62rem;padding:6px 10px;}
      .loader-logo{font-size:34px;letter-spacing:3px;}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Page Loader -->
<div class="page-loader" id="pageLoader">
  <div class="loader-logo"><span class="t-aman">YOUR</span> <span class="t-md">NAME</span></div>
  <div class="loader-bar"></div>
  <div class="loader-text">Loading...</div>
</div>

<div class="glow-mid"></div>
<div class="glow-top-right"></div>
<div class="grain-overlay"></div>

<div class="page">
  <div class="main-wrap">

    <!-- Status bar -->
    <div class="statusbar reveal">
      <div class="sb-left">
        <span class="sb-dot"></span> SYSTEM ONLINE
      </div>
      <div class="sb-right">
        <span><i class="fas fa-shield-alt"></i> SECURE</span>
        <span><i class="fas fa-bolt"></i> v2.0</span>
      </div>
    </div>

    <!-- Hero -->
    <div class="hero reveal-scale delay-1">
      <div class="hero-left">
        <div class="profile-wrap">
          <img src="YOUR IMAGE LINK" alt="AMAN ULLAH">
          <span class="profile-ring"></span>
          <span class="profile-corner tl"></span>
          <span class="profile-corner tr"></span>
          <span class="profile-corner bl"></span>
          <span class="profile-corner br"></span>
          <span class="profile-orbit"></span>
        </div>
        <div class="brand-text">
          <h1 class="app-title"><span class="t-aman">YOUR</span> <span class="t-md">NAME</span></h1>
          <span class="app-sub">TikTok Downloader Pro</span>
        </div>
      </div>
    </div>

    <div class="divider reveal delay-2"></div>

    <!-- Download section -->
    <div class="section-title reveal delay-3">
      <i class="fas fa-download"></i> Download TikTok Video
    </div>

    <div class="input-wrap reveal delay-3">
      <i class="fas fa-link input-icon"></i>
      <input type="text" id="videoUrl" placeholder="Paste TikTok link here...">
    </div>

    <button class="btn-generate reveal delay-3" id="downloadBtn">
      <i class="fas fa-download"></i> DOWNLOAD NOW
    </button>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-8" style="text-align:center;padding:30px 0;">
      <div class="loader-ring"></div>
      <p style="font-size:0.7rem;color:var(--primary-bright);font-weight:900;letter-spacing:3px;text-transform:uppercase;animation:pulse 1.5s infinite;">Decrypting Content...</p>
    </div>

    <!-- Result -->
    <div id="result"></div>

    <!-- WhatsApp button -->
    <a href="YOUR CHANNEL LINK" target="_blank" rel="noopener" class="whatsapp-btn reveal">
      <i class="fab fa-whatsapp"></i> Chat on WhatsApp
    </a>

  </div>

  <footer class="foot-note">
    <span style="font-family:'Poppins',sans-serif;font-size:10px;font-weight:900;color:#FFFFFF;">THIS TOOL DEVELOPED BY</span> |
    <span style="font-family:'Nova Square',sans-serif;font-size:10px;font-weight:900;letter-spacing:1px;color:#FF8C00;-webkit-text-stroke:0.5px #FF8C00;">YOUR NAME</span>
  </footer>
</div>

<script>
  /* Loader */
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('pageLoader').classList.add('hidden-loader');
      document.body.classList.add('loaded');
    }, 1000);
  });

  /* Reveal observer */
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

  function initReveal() {
    document.querySelectorAll('.reveal, .reveal-scale').forEach(el => {
      if (!el.classList.contains('revealed')) revealObserver.observe(el);
    });
  }
  initReveal();

  /* Toast */
  function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerText = message;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-20px)';
      setTimeout(() => toast.remove(), 400);
    }, 3500);
  }

  /* Download logic */
  $(document).ready(function() {
    $('#downloadBtn').click(function() {
      const url = $('#videoUrl').val().trim();
      if(!url) {
        showToast('Please paste a TikTok link first!', 'error');
        return;
      }

      $('#result').empty();
      $('#loading').removeClass('hidden').fadeIn();
      $('#downloadBtn').prop('disabled', true);

      $.ajax({
        url: 'https://www.tikwm.com/api/?url=' + encodeURIComponent(url),
        type: 'GET',
        success: function(res) {
          $('#loading').hide();
          $('#downloadBtn').prop('disabled', false);
          if(res.code == 0) {
            const v = res.data;
            const html = `
              <div class="result-card">
                <video controls poster="${v.cover}">
                  <source src="${v.play}" type="video/mp4">
                </video>
                <div class="author-box">
                  <img src="${v.author.avatar}" alt="avatar">
                  <div>
                    <h4>${v.author.nickname}</h4>
                    <p>ID: ${v.author.unique_id}</p>
                  </div>
                </div>
                <div class="result-btns">
                  <a href="${v.play}" target="_blank" class="res-btn primary">
                    <i class="fas fa-save"></i> SAVE VIDEO
                  </a>
                  <a href="${v.music}" target="_blank" class="res-btn secondary">
                    <i class="fas fa-music"></i> SAVE MP3
                  </a>
                </div>
              </div>
            `;
            $('#result').html(html);
            showToast('Video fetched successfully!', 'success');
            setTimeout(initReveal, 50);
          } else {
            showToast('Could not fetch video. Try another link.', 'error');
          }
        },
        error: function() {
          $('#loading').hide();
          $('#downloadBtn').prop('disabled', false);
          showToast('Network error. Server unreachable.', 'error');
        }
      });
    });

    /* Enter key support */
    $('#videoUrl').on('keypress', function(e) {
      if(e.which === 13) $('#downloadBtn').click();
    });
  });
</script>
</body>
</html>
