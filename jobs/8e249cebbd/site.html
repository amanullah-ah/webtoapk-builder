/* Matrix-style animated number background */
(function(){
 const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d');
 let w=0,h=0,cols=0,drops=[];
 function resize(){
   const dpr=Math.min(window.devicePixelRatio||1,2);
   w=window.innerWidth;h=window.innerHeight;
   canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
   ctx.setTransform(dpr,0,0,dpr,0,0);
   cols=Math.ceil(w/17);drops=Array.from({length:cols},()=>Math.random()*-h/15);
 }
 function draw(){
   ctx.fillStyle='rgba(7,7,7,0.12)';ctx.fillRect(0,0,w,h);
   ctx.font='12px monospace';
   for(let i=0;i<drops.length;i++){
     const n=Math.random()>0.5?'1':'0';
     ctx.fillStyle=Math.random()>.94?'#fff09a':'#b89a00';
     ctx.fillText(n,i*17,drops[i]*17);
     if(drops[i]*17>h&&Math.random()>.975)drops[i]=0;
     drops[i]+=.35+Math.random()*.45;
   }
   requestAnimationFrame(draw);
 }
 window.addEventListener('resize',resize,{passive:true});resize();draw();
})();

 statusBox.className='status show '+type;
 statusBox.textContent=message;
}
function setBusy(busy){
 button.disabled=busy;
 button.style.opacity=busy?'.7':'1';

}

 results.classList.remove('show');

   showStatus('Please enter a complete valid URL, for example https://www.example.com/','bad');return;
 }
 if(!['http:','https:'].includes(parsed.protocol)){

 }
 if(!parsed.hostname.includes('.')||parsed.hostname.startsWith('.')||parsed.hostname.endsWith('.')){

 setBusy(true);
 showStatus('Scraping Website Please Wait....','info');
 try{

     throw new Error(data.message||data.error||'The API response did not contain a successful ZIP download link. The request format may differ from this default integration.');
   }
 }catch(error){

 }finally{setBusy(false)}
});
